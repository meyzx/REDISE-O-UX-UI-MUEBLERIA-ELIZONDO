<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elizondo · Prototipo de rediseño</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efeae1; --paper-2:#f9f6f0; --card:#ffffff;
    --ink:#2a2420; --ink-2:#5c5349; --muted:#8c8175; --line:#dcd4c6; --line-strong:#c7bba6;
    --walnut:#7a4326; --walnut-2:#965430; --walnut-wash:#f1e3d6;
    --teal:#2f5d62; --teal-2:#3f7a80; --teal-wash:#e2ecec;
    --warning:#b8860b;
    --shadow: 0 1px 2px rgba(42,36,32,.06), 0 8px 24px -12px rgba(42,36,32,.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1d1915; --paper-2:#24201a; --card:#2a251f;
      --ink:#ede6d9; --ink-2:#c7bdae; --muted:#93897a; --line:#3c3327; --line-strong:#4d4230;
      --walnut:#e0a074; --walnut-2:#eab68e; --walnut-wash:#3a2c22;
      --teal:#8bc3c6; --teal-2:#a3d2d4; --teal-wash:#213233;
      --warning:#e0b23e;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1d1915; --paper-2:#24201a; --card:#2a251f;
    --ink:#ede6d9; --ink-2:#c7bdae; --muted:#93897a; --line:#3c3327; --line-strong:#4d4230;
    --walnut:#e0a074; --walnut-2:#eab68e; --walnut-wash:#3a2c22;
    --teal:#8bc3c6; --teal-2:#a3d2d4; --teal-wash:#213233;
    --warning:#e0b23e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:"Work Sans",system-ui,-apple-system,sans-serif; line-height:1.5; }
  h1,h2,h3,h4{ font-family:"Fraunces",Georgia,serif; font-weight:600; color:var(--ink); text-wrap:balance; margin:0; }
  p{margin:0;}
  img,svg{max-width:100%;}
  .mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; }
  ::selection{ background:var(--walnut); color:#fff; }

  .notice{ background:var(--ink); color:var(--paper); text-align:center; font-size:.78rem; padding:7px 16px; font-family:"IBM Plex Mono",monospace; }
  .notice b{ color:var(--warning); }

  .pv-nav{ display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:20; }
  .pv-nav .plogo{ font-family:"Fraunces",serif; font-weight:700; font-size:1.25rem; color:var(--walnut); flex:none; cursor:pointer; }
  .pv-nav .pcats{ display:flex; gap:22px; font-size:.9rem; color:var(--ink-2); flex:1; }
  .pv-nav .pcats span{ cursor:pointer; padding:4px 2px; border-bottom:2px solid transparent; white-space:nowrap; }
  .pv-nav .pcats span:hover, .pv-nav .pcats span.active{ color:var(--walnut); border-color:var(--walnut); }
  .pv-nav .pactions{ display:flex; align-items:center; gap:12px; flex:none; }
  .pv-search{ font-size:.85rem; border:1px solid var(--line-strong); border-radius:99px; padding:8px 14px; color:var(--ink); background:var(--paper-2); width:190px; font-family:inherit; }
  .picon-btn{ position:relative; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-2); border:1px solid var(--line); background:var(--paper-2); font-size:1.05rem; }
  .picon-btn .cnt{ position:absolute; top:-5px; right:-5px; background:var(--walnut); color:#fff; font-size:.65rem; font-family:"IBM Plex Mono",monospace; border-radius:99px; min-width:16px; height:16px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
  .hamburger{ display:none; all:unset; cursor:pointer; font-size:1.3rem; margin-right:2px; }

  .pv-crumb{ max-width:1200px; margin:0 auto; padding:14px 24px 0; font-size:.8rem; color:var(--muted); font-family:"IBM Plex Mono",monospace; }
  .pv-crumb span{ cursor:pointer; }
  .pv-crumb span:hover{ color:var(--walnut); text-decoration:underline; }
  .pv-main{ max-width:1200px; margin:0 auto; padding:18px 24px 80px; display:flex; flex-direction:column; gap:26px; min-height:70vh; }

  .pv-hero{ background:linear-gradient(120deg,var(--walnut-wash),var(--teal-wash)); border-radius:14px; padding:44px 40px; display:flex; flex-direction:column; gap:10px; }
  .pv-hero .h{ font-size:2rem; font-weight:600; max-width:16ch; }
  .pv-hero .s{ font-size:1rem; color:var(--ink-2); max-width:50ch; }
  .pv-promise{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .pv-promise div{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; font-size:.82rem; color:var(--ink-2); text-align:center; }

  h4.eyebrow{ font-family:"IBM Plex Mono",monospace; font-size:.74rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:2px; }

  .pv-layout{ display:flex; gap:28px; align-items:flex-start; }
  .filter-trigger{ display:none; }
  .filter-trigger button{ all:unset; cursor:pointer; font-size:.85rem; border:1px solid var(--line-strong); background:var(--card); padding:9px 16px; border-radius:8px; color:var(--ink-2); }
  .pv-filters{ width:230px; flex:none; display:flex; flex-direction:column; gap:18px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; position:sticky; top:80px; }
  .pv-filters h4{ font-family:"IBM Plex Mono",monospace; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:8px; }
  .pv-filters .grp{ display:flex; flex-direction:column; gap:8px; }
  .pv-filters label{ display:flex; align-items:center; gap:8px; font-size:.86rem; color:var(--ink-2); cursor:pointer; }
  .pv-filters input[type=checkbox]{ width:15px; height:15px; accent-color:var(--teal); }
  .pv-filters input[type=range]{ width:100%; accent-color:var(--teal); }
  .pv-filters select{ font-size:.85rem; padding:7px; border-radius:8px; border:1px solid var(--line-strong); background:var(--paper-2); width:100%; font-family:inherit; color:var(--ink); }
  .apply-btn{ all:unset; cursor:pointer; text-align:center; width:100%; background:var(--teal); color:#fff; padding:10px; border-radius:8px; font-size:.86rem; font-weight:600; }

  .pv-results{ flex:1; min-width:0; display:flex; flex-direction:column; gap:16px; }
  .pv-resulthead{ display:flex; justify-content:space-between; align-items:center; font-size:.86rem; color:var(--ink-2); }
  .pv-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .p-card{ background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; transition:box-shadow .15s, transform .15s; }
  .p-card:hover{ box-shadow:var(--shadow); transform:translateY(-2px); }
  .p-media{ aspect-ratio:1.2; background:var(--paper-2); display:flex; align-items:center; justify-content:center; position:relative; color:var(--teal); }
  .p-media svg{ width:56%; height:56%; }
  .p-badge{ position:absolute; top:10px; left:10px; background:var(--walnut); color:#fff; font-size:.65rem; font-family:"IBM Plex Mono",monospace; padding:3px 9px; border-radius:99px; }
  .p-info{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:5px; }
  .p-name{ font-size:.94rem; font-weight:600; }
  .p-specs{ font-size:.74rem; color:var(--muted); font-family:"IBM Plex Mono",monospace; }
  .p-rating{ font-size:.76rem; color:var(--ink-2); }
  .p-rating .stars{ color:var(--warning); }
  .p-price{ font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:1.05rem; margin-top:2px; }
  .p-add{ all:unset; cursor:pointer; margin-top:8px; text-align:center; background:var(--walnut); color:#fff; padding:9px; border-radius:8px; font-size:.84rem; font-weight:600; }
  .p-add:hover{ background:var(--walnut-2); }

  .pd-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:36px; }
  .pd-media{ background:var(--paper-2); border-radius:14px; display:flex; align-items:center; justify-content:center; aspect-ratio:1.1; color:var(--teal); }
  .pd-media svg{ width:52%; height:52%; }
  .pd-info{ display:flex; flex-direction:column; gap:14px; }
  .pd-info h2{ font-size:1.6rem; }
  .pd-price{ font-family:"IBM Plex Mono",monospace; font-size:1.6rem; font-weight:700; color:var(--walnut); }
  .pd-rating{ font-size:.9rem; color:var(--ink-2); }
  .pd-rating .stars{ color:var(--warning); }
  .pd-variants{ display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
  .pd-cta{ display:flex; gap:12px; flex-wrap:wrap; }
  .btn-primary{ all:unset; cursor:pointer; background:var(--walnut); color:#fff; padding:13px 24px; border-radius:9px; font-weight:600; font-size:.92rem; }
  .btn-primary:hover{ background:var(--walnut-2); }
  .btn-secondary{ all:unset; cursor:pointer; background:transparent; color:var(--teal); border:1.5px solid var(--teal); padding:12px 20px; border-radius:9px; font-weight:600; font-size:.92rem; }
  .btn-secondary:hover{ background:var(--teal-wash); }
  .pd-trust{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:4px; }
  .pd-trust div{ font-size:.8rem; color:var(--ink-2); display:flex; gap:7px; align-items:flex-start; }
  .pd-tabs{ display:flex; gap:20px; border-bottom:1px solid var(--line); margin-top:8px; }
  .pd-tabs button{ all:unset; cursor:pointer; padding:9px 2px; font-size:.9rem; color:var(--muted); border-bottom:2px solid transparent; }
  .pd-tabs button[aria-current="true"]{ color:var(--ink); border-color:var(--walnut); font-weight:600; }
  table.pd-specs{ width:100%; border-collapse:collapse; font-size:.9rem; }
  table.pd-specs td{ padding:9px 0; border-bottom:1px solid var(--line); }
  .pd-specs td:first-child{ color:var(--muted); width:40%; font-family:"IBM Plex Mono",monospace; font-size:.8rem; }
  .review{ border:1px solid var(--line); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:5px; font-size:.88rem; }
  .review .rh{ display:flex; justify-content:space-between; font-size:.78rem; color:var(--muted); }

  .mob-menu{ position:fixed; inset:0; background:var(--paper); z-index:50; transform:translateX(-100%); transition:transform .2s ease; padding:20px; overflow-y:auto; }
  .mob-menu.open{ transform:translateX(0); }
  .mob-cat{ padding:14px 4px; border-bottom:1px solid var(--line); font-weight:600; font-size:1.05rem; display:flex; justify-content:space-between; cursor:pointer; }
  .close-x{ all:unset; cursor:pointer; color:var(--muted); font-size:1.2rem; line-height:1; padding:4px; }

  .filter-sheet{ position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); border-radius:18px 18px 0 0; transform:translateY(100%); transition:transform .22s ease; z-index:48; max-height:82vh; overflow-y:auto; padding:18px 20px 24px; box-shadow:0 -10px 30px rgba(0,0,0,.15); }
  .filter-sheet.open{ transform:translateY(0); }
  .sheet-handle{ width:38px; height:4px; background:var(--line-strong); border-radius:99px; margin:0 auto 14px; }

  .cart-drawer{ position:fixed; top:0; right:0; height:100%; width:360px; max-width:92vw; background:var(--card); border-left:1px solid var(--line); box-shadow:-8px 0 24px -12px rgba(0,0,0,.3); transform:translateX(100%); transition:transform .25s ease; z-index:60; display:flex; flex-direction:column; }
  .cart-drawer.open{ transform:translateX(0); }
  .cart-head{ padding:18px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .cart-items{ flex:1; overflow-y:auto; padding:14px 20px; display:flex; flex-direction:column; gap:12px; }
  .cart-item{ display:flex; gap:12px; align-items:center; font-size:.86rem; }
  .cart-item .ci-media{ width:48px; height:48px; background:var(--paper-2); border-radius:7px; display:flex; align-items:center; justify-content:center; color:var(--teal); flex:none; }
  .cart-item .ci-media svg{ width:60%; height:60%; }
  .cart-item .ci-info{ flex:1; }
  .cart-foot{ padding:18px 20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:12px; }
  .cart-foot .subtotal{ display:flex; justify-content:space-between; font-weight:700; font-family:"IBM Plex Mono",monospace; }
  .scrim{ position:fixed; inset:0; background:rgba(20,15,10,.35); z-index:45; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .scrim.show{ opacity:1; pointer-events:auto; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); padding:12px 22px; border-radius:99px; font-size:.88rem; opacity:0; pointer-events:none; transition:all .25s ease; z-index:70; box-shadow:var(--shadow); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .sticky-cta{ display:none; }
  .site-footer{ text-align:center; padding:28px 24px 34px; font-size:.78rem; color:var(--muted); border-top:1px solid var(--line); }

  @media (max-width:820px){
    .pv-nav .pcats{ display:none; }
    .pv-nav .pv-search{ display:none; }
    .hamburger{ display:inline-block; }
    .pv-filters{ display:none; }
    .filter-trigger{ display:block; }
    .pv-grid{ grid-template-columns:repeat(2,1fr); }
    .pd-wrap{ grid-template-columns:1fr; gap:22px; }
    .pv-promise{ grid-template-columns:repeat(2,1fr); }
    .pv-hero{ padding:30px 22px; }
    .pv-hero .h{ font-size:1.5rem; }
    .pd-cta.desktop-only{ display:none; }
    .sticky-cta.show{ display:flex; position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:12px 16px; gap:10px; margin:0 -24px -80px; z-index:15; }
    .sticky-cta .btn-primary, .sticky-cta .btn-secondary{ flex:1; text-align:center; padding:13px; }
    .pv-main{ padding-bottom:24px; }
  }
  @media (max-width:480px){
    .pv-grid{ grid-template-columns:1fr 1fr; gap:10px; }
    .pv-nav{ padding:12px 16px; }
    .pv-crumb, .pv-main{ padding-left:16px; padding-right:16px; }
  }
</style>
</head>

  {id:'salas', label:'Salas y Sillones'},

const PRODUCTS = [
  {id:1, name:'Sofá Manhattan', cat:'salas', sub:'Sofás', material:'Piel', color:'Negro', price:51519, dims:'220 × 97 × 85 cm', badge:'Nuevo', rating:4.6, reviews:18, icon:'ic-sofa', variants:['Negro','Café','Gris']},
  {id:2, name:'Sala Modular West CM-161', cat:'salas', sub:'Modulares', material:'Tela', color:'Grafito', price:38900, dims:'280 × 160 × 80 cm', badge:'Popular', rating:4.4, reviews:31, icon:'ic-sofa', variants:['Grafito','Beige']},
  {id:3, name:'Sillón Individual Oslo', cat:'salas', sub:'Individuales', material:'Tela', color:'Azul petróleo', price:12450, dims:'90 × 85 × 95 cm', badge:'', rating:4.7, reviews:12, icon:'ic-armchair', variants:['Azul petróleo','Mostaza','Gris']},
  {id:4, name:'Comedor Ómega 6 plazas', cat:'comedores', sub:'Comedores', material:'Madera', color:'Nogal', price:29800, dims:'180 × 90 × 75 cm', badge:'Oferta', rating:4.5, reviews:9, icon:'ic-table', variants:['Nogal','Blanco']},
  {id:5, name:'Mesa auxiliar Praga', cat:'comedores', sub:'Mesas auxiliares', material:'Madera', color:'Roble', price:4250, dims:'45 × 45 × 50 cm', badge:'', rating:4.3, reviews:6, icon:'ic-side-table', variants:['Roble']},
  {id:6, name:'Cama RKJ-C117 King Size', cat:'recamara', sub:'Camas', material:'Tapizada', color:'Beige', price:22300, dims:'200 × 200 × 110 cm', badge:'Nuevo', rating:4.8, reviews:24, icon:'ic-bed', variants:['Beige','Gris']},
  {id:7, name:'Buró Almería', cat:'recamara', sub:'Burós', material:'Madera', color:'Blanco', price:3180, dims:'45 × 40 × 55 cm', badge:'', rating:4.2, reviews:7, icon:'ic-nightstand', variants:['Blanco','Nogal']},
  {id:8, name:'Espejo Ulán', cat:'decoracion', sub:'Espejos', material:'Metal', color:'Dorado', price:2690, dims:'80 × 60 cm', badge:'', rating:4.6, reviews:14, icon:'ic-mirror', variants:['Dorado','Plata']},
  {id:9, name:'Cuadro Venado minimalista', cat:'decoracion', sub:'Cuadros', material:'Lienzo', color:'Blanco y negro', price:1450, dims:'60 × 80 cm', badge:'', rating:4.4, reviews:5, icon:'ic-frame', variants:['Blanco y negro']},
];
const REVIEWS = [
  {stars:5, txt:'Buena relación calidad-precio, tal cual la descripción y las medidas publicadas.', who:'Compra verificada (ejemplo) · Monterrey'},
  {stars:4, txt:'Llegó a tiempo y bien empacado. El color se ve un poco distinto a la foto, pero me gustó.', who:'Compra verificada (ejemplo) · CDMX'},
  {stars:5, txt:'Superó mis expectativas, el material se siente de calidad. Volvería a comprar aquí.', who:'Compra verificada (ejemplo) · Guadalajara'},
];

let screen = {type:'home'};
let filters = {materials:new Set(), maxPrice:60000, sort:'rel'};
let cart = [];
let selectedVariant = {};
let pdTab = 'specs';

function money(n){ return '$'+n.toLocaleString('es-MX'); }
function stars(r){ const full = Math.round(r); return '★'.repeat(full)+'☆'.repeat(5-full); }
function iconSvg(icon, cls){ return `<svg class="${cls||''}"><use href="#${icon}"/></svg>`; }

function buildNav(){
  const cats = document.getElementById('pcats');
  cats.innerHTML = CATEGORIES.map(c=>`<span data-cat="${c.id}">${c.label}</span>`).join('');
  cats.querySelectorAll('span').forEach(s=>s.addEventListener('click',()=>goCategory(s.dataset.cat)));
  const mobList = document.getElementById('mobCatList');
  mobList.innerHTML = CATEGORIES.map(c=>`<div class="mob-cat" data-cat="${c.id}">${c.label} <span>›</span></div>`).join('');
  mobList.querySelectorAll('.mob-cat').forEach(d=>d.addEventListener('click',()=>{ goCategory(d.dataset.cat); toggleMobMenu(false); }));
}

function goHome(){ screen = {type:'home'}; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function goCategory(catId){ screen = {type:'category', cat:catId}; filters = {materials:new Set(), maxPrice:60000, sort:'rel'}; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function openProduct(id){ screen = {type:'product', id}; selectedVariant[id] = selectedVariant[id] ?? 0; pdTab='specs'; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function doSearch(q){
  q = q.trim().toLowerCase();
  if(!q) return;
  const hit = PRODUCTS.find(p=>p.name.toLowerCase().includes(q));
  if(hit) openProduct(hit.id);
}

function productCard(p){
  const badge = p.badge ? `<span class="p-badge">${p.badge}</span>` : '';
  return `<div class="p-card" onclick="openProduct(${p.id})">
    <div class="p-media">${badge}${iconSvg(p.icon)}</div>
    <div class="p-info">
      <div class="p-name">${p.name}</div>
      <div class="p-specs">${p.material} · ${p.color} · ${p.dims}</div>
      <div class="p-rating"><span class="stars">${stars(p.rating)}</span> ${p.rating.toFixed(1)} (${p.reviews})</div>
      <div class="p-price">${money(p.price)}</div>
      <button class="p-add" onclick="event.stopPropagation(); addToCart(${p.id});">Agregar al carrito</button>
    </div>
  </div>`;
}

function render(){
  document.querySelectorAll('#pcats span').forEach(s=>s.classList.toggle('active', screen.cat===s.dataset.cat));
  const root = document.getElementById('screenRoot');
  const crumb = document.getElementById('crumb');

  if(screen.type==='home'){
    crumb.innerHTML = '';
    root.innerHTML = `
      <div class="pv-hero">
        <div class="h">Muebles que sí caben en tu espacio</div>
        <div class="s">Filtra por medida, material y presupuesto — sin adivinar. Envío a toda la República.</div>
      </div>
      <div class="pv-promise">
        <div>🚚 Envío nacional</div><div>🛡 Compra protegida</div><div>💳 Pago seguro</div><div>💬 Asesoría 24/7</div>
      </div>
      <div>
        <h4 class="eyebrow">Categorías</h4>
        <div class="pv-grid" style="grid-template-columns:repeat(4,1fr);">
          ${CATEGORIES.map(c=>`<div class="p-card" style="cursor:pointer;" onclick="goCategory('${c.id}')"><div class="p-media">${iconSvg(PRODUCTS.find(p=>p.cat===c.id).icon)}</div><div class="p-info"><div class="p-name">${c.label}</div><div class="p-specs">${PRODUCTS.filter(p=>p.cat===c.id).length} productos</div></div></div>`).join('')}
        </div>
      </div>
      <div>
        <h4 class="eyebrow">Destacados</h4>
        <div class="pv-grid">${PRODUCTS.slice(0,3).map(productCard).join('')}</div>
      </div>`;
  }

  if(screen.type==='category'){
    const cat = CATEGORIES.find(c=>c.id===screen.cat);
    crumb.innerHTML = `<span onclick="goHome()">Inicio</span> &nbsp;›&nbsp; ${cat.label}`;
    const inCat = PRODUCTS.filter(p=>p.cat===screen.cat);
    const materials = [...new Set(inCat.map(p=>p.material))];
    let list = inCat.filter(p=> (filters.materials.size===0 || filters.materials.has(p.material)) && p.price<=filters.maxPrice );
    if(filters.sort==='price-asc') list = list.slice().sort((a,b)=>a.price-b.price);
    if(filters.sort==='price-desc') list = list.slice().sort((a,b)=>b.price-a.price);
    if(filters.sort==='name') list = list.slice().sort((a,b)=>a.name.localeCompare(b.name));

    const filterHTML = `
      <div class="grp">
        <h4>Material</h4>
        ${materials.map(m=>`<label><input type="checkbox" ${filters.materials.has(m)?'checked':''} onchange="toggleMaterial('${m}')"> ${m}</label>`).join('')}
      </div>
      <div class="grp">
        <h4>Precio máximo</h4>
        <input type="range" min="1000" max="60000" step="500" value="${filters.maxPrice}" oninput="setMaxPrice(this.value)">
        <div class="mono" style="font-size:.8rem;">Hasta ${money(Number(filters.maxPrice))}</div>
      </div>
      <div class="grp">
        <h4>Ordenar por</h4>
        <select onchange="setSort(this.value)">
          <option value="rel" ${filters.sort==='rel'?'selected':''}>Relevancia</option>
          <option value="price-asc" ${filters.sort==='price-asc'?'selected':''}>Precio: menor a mayor</option>
          <option value="price-desc" ${filters.sort==='price-desc'?'selected':''}>Precio: mayor a menor</option>
          <option value="name" ${filters.sort==='name'?'selected':''}>Nombre</option>
        </select>
      </div>`;

    root.innerHTML = `
      <div class="filter-trigger"><button onclick="toggleFilterSheet(true)">⚙ Filtrar (${filters.materials.size})</button></div>
      <div class="pv-layout">
        <div class="pv-filters">${filterHTML}<button class="apply-btn" onclick="render()">Aplicar</button></div>
        <div class="pv-results">
          <div class="pv-resulthead"><span>${list.length} producto${list.length===1?'':'s'}</span></div>
          <div class="pv-grid">${list.length? list.map(productCard).join('') : '<p style="color:var(--ink-2)">Ningún producto cumple estos filtros. Prueba subir el precio máximo.</p>'}</div>
        </div>
      </div>`;
    document.getElementById('filterSheetBody').innerHTML = filterHTML;
  }

  if(screen.type==='product'){
    const p = PRODUCTS.find(x=>x.id===screen.id);
    const cat = CATEGORIES.find(c=>c.id===p.cat);
    crumb.innerHTML = `<span onclick="goHome()">Inicio</span> &nbsp;›&nbsp; <span onclick="goCategory('${p.cat}')">${cat.label}</span> &nbsp;›&nbsp; ${p.name}`;
    const vi = selectedVariant[p.id] ?? 0;
    root.innerHTML = `
      <div class="pd-wrap">
        <div class="pd-media">${iconSvg(p.icon)}</div>
        <div class="pd-info">
          <h2>${p.name}</h2>
          <div class="pd-rating"><span class="stars">${stars(p.rating)}</span> ${p.rating.toFixed(1)} · ${p.reviews} reseñas</div>
          <div class="pd-price">${money(p.price)}</div>
          <div class="pd-variants">
            <span class="mono" style="font-size:.82rem; color:var(--muted);">Color:</span>
            ${p.variants.map((v,i)=>`<span class="swatch" title="${v}" style="width:20px;height:20px;border-radius:50%;cursor:pointer;background:${swatchColor(v)};box-shadow:${i===vi?'0 0 0 2px var(--walnut)':'0 0 0 1px var(--line-strong)'};" onclick="setVariant(${p.id},${i})"></span>`).join('')}
            <span class="mono" style="font-size:.82rem;">${p.variants[vi]}</span>
          </div>
          <div class="pd-cta desktop-only">
            <button class="btn-primary" onclick="addToCart(${p.id})">Agregar al carrito</button>
            <button class="btn-secondary" onclick="quoteWhatsApp('${p.name.replace(/'/g,"")}')">Cotizar por WhatsApp</button>
          </div>
          <div class="pd-trust">
            <div>🚚 Envío gratis a todo México</div>
            <div>🛡 Garantía de satisfacción, devolución en 15 días</div>
            <div>💳 Pago seguro: transferencia, tarjeta o depósito</div>
            <div>💬 Asesoría disponible 24/7</div>
          </div>
        </div>
      </div>
      <div class="pd-tabs">
        <button aria-current="${pdTab==='specs'}" onclick="setPdTab('specs')">Especificaciones</button>
        <button aria-current="${pdTab==='reviews'}" onclick="setPdTab('reviews')">Reseñas (${p.reviews})</button>
      </div>
      <div>
        ${pdTab==='specs' ? `
        <table class="pd-specs"><tr><td>Categoría</td><td>${cat.label} — ${p.sub}</td></tr><tr><td>Material</td><td>${p.material}</td></tr><tr><td>Color</td><td>${p.variants[vi]}</td></tr><tr><td>Dimensiones</td><td>${p.dims}</td></tr><tr><td>Envío</td><td>Gratis a toda la República, 2–7 días hábiles según destino</td></tr></table>`
        : `<div style="display:flex; flex-direction:column; gap:12px;"><p style="font-size:.82rem; color:var(--ink-2);">Reseñas de ejemplo para esta maqueta — no corresponden a compradores reales.</p>${REVIEWS.map(r=>`<div class="review"><div class="rh"><span class="stars">${stars(r.stars)}</span><span>${r.who}</span></div><p>${r.txt}</p></div>`).join('')}</div>`}
      </div>
      <div class="sticky-cta show">
        <button class="btn-primary" onclick="addToCart(${p.id})">Agregar · ${money(p.price)}</button>
        <button class="btn-secondary" onclick="quoteWhatsApp('${p.name.replace(/'/g,"")}')">WhatsApp</button>
      </div>`;
  }
}

function swatchColor(name){
  const map = {'Negro':'#2a2420','Café':'#6b4226','Gris':'#8c8175','Grafito':'#4a4640','Beige':'#d8c7a8','Azul petróleo':'#2f5d62','Mostaza':'#c98500','Nogal':'#6b4226','Blanco':'#f2ede2','Roble':'#b98a52','Dorado':'#c9a227','Plata':'#b7bcbf','Blanco y negro':'#75726c'};
  return map[name] || '#8c8175';
}
function setVariant(id,i){ selectedVariant[id]=i; render(); }
function setPdTab(t){ pdTab=t; render(); }
function toggleMaterial(m){ filters.materials.has(m) ? filters.materials.delete(m) : filters.materials.add(m); render(); }
function setMaxPrice(v){ filters.maxPrice = Number(v); render(); }
function setSort(v){ filters.sort = v; render(); }

/* ---- Cart ---- */
function addToCart(id){
  const line = cart.find(c=>c.id===id);
  if(line) line.qty++; else cart.push({id, qty:1});
  updateCartUI();
  toast('Agregado al carrito (simulado)');
  toggleCart(true);
}
function changeQty(id, delta){
  const line = cart.find(c=>c.id===id);
  if(!line) return;
  line.qty += delta;
  if(line.qty<=0) cart = cart.filter(c=>c.id!==id);
  updateCartUI();
}
function updateCartUI(){
  const count = cart.reduce((s,c)=>s+c.qty,0);
  document.getElementById('cartCount').textContent = count;
  const itemsEl = document.getElementById('cartItems');
  if(cart.length===0){ itemsEl.innerHTML = '<p style="font-size:.86rem; color:var(--ink-2);">Tu carrito está vacío.</p>'; }
  else itemsEl.innerHTML = cart.map(c=>{
    const p = PRODUCTS.find(x=>x.id===c.id);
    return `<div class="cart-item"><div class="ci-media">${iconSvg(p.icon)}</div><div class="ci-info"><div style="font-weight:600;">${p.name}</div><div class="mono" style="font-size:.78rem; color:var(--muted);">${money(p.price)} × ${c.qty}</div></div>
      <div style="display:flex; gap:5px;"><button class="close-x" onclick="changeQty(${c.id},-1)">−</button><button class="close-x" onclick="changeQty(${c.id},1)">+</button></div></div>`;
  }).join('');
  const subtotal = cart.reduce((s,c)=> s + PRODUCTS.find(p=>p.id===c.id).price*c.qty, 0);
  document.getElementById('cartSubtotal').textContent = money(subtotal);
}
function anyOverlayOpen(){
  return document.getElementById('cartDrawer').classList.contains('open') ||
         document.getElementById('mobMenu').classList.contains('open') ||
         document.getElementById('filterSheet').classList.contains('open');
}
function syncScrim(){ document.getElementById('scrim').classList.toggle('show', anyOverlayOpen()); }
function toggleCart(open){ document.getElementById('cartDrawer').classList.toggle('open', open); syncScrim(); }
function toggleMobMenu(open){ document.getElementById('mobMenu').classList.toggle('open', open); syncScrim(); }
function toggleFilterSheet(open){ document.getElementById('filterSheet').classList.toggle('open', open); syncScrim(); }
function closeAllOverlays(){ toggleCart(false); toggleMobMenu(false); toggleFilterSheet(false); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 2200);
}
function quoteWhatsApp(name){ toast(`Simulado: se abriría WhatsApp con la cotización de "${name}"`); }
function submitQuote(){
  toast('Cotización enviada (simulado) — en el sitio real continúa por WhatsApp o correo');
  toggleCart(false);
}

buildNav();
goHome();
updateCartUI();
</script>
</body>
</html>
